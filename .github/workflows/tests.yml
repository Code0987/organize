name: tests

on:
  push:
    paths-ignore:
      - "docs/**"
      - "*.md"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  # Headless Qt for GUI tests across all OS runners
  QT_QPA_PLATFORM: offscreen
  ORGANIZE_SKIP_HOST_PROBES: "1"
  ORGANIZE_UI_SCALE: "1"
  ORGANIZE_THEME: light
  # Avoid interactive Qt/plugin noise in CI logs
  QT_LOGGING_RULES: "*.debug=false"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Linux Qt runtime libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libxkbcommon0 \
            libgl1 \
            libdbus-1-3

      - name: Version info
        run: |
          uv run python main.py --version

      - name: Test with pytest
        run: |
          uv run --group dev python -m pytest tests

      - name: Check with MyPy
        run: |
          # Core library only; the PyQt6 UI is covered by pytest (mypy + Qt stubs are noisy).
          uv run --group dev mypy organize
