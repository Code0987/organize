name: tests

on:
  push:
    paths-ignore:
      - "docs/**"
      - "*.md"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Offscreen Qt so organize_gui widget tests run in CI without a display.
env:
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      # PyQt6 wheels need these shared libs on headless Ubuntu runners.
      - name: Install system libs for Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libopengl0 \
            libglib2.0-0 \
            libfontconfig1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libx11-xcb1 \
            libxcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0

      - name: Install project (core + gui + dev)
        run: uv sync --extra gui --group dev

      - name: Version info
        run: uv run python -m organize --version

      - name: Test with pytest
        run: uv run python -m pytest tests -q --tb=short

      - name: Type-check with MyPy
        run: uv run mypy organize organize_gui main.py

  package:
    name: build package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install system libs for Qt (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libglib2.0-0 libfontconfig1 \
            libxkbcommon0 libdbus-1-3 libx11-xcb1 libxcb1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Build sdist and wheel
        run: |
          uv build
          ls -la dist/

      - name: Verify package metadata
        run: |
          uvx twine check dist/*

      - name: Install wheel in a clean environment
        run: |
          uv venv .venv-pkg
          WHEEL=$(ls dist/*.whl | head -n1)
          # Core wheel (no gui extra)
          uv pip install --python .venv-pkg "${WHEEL}"
          .venv-pkg/bin/python -c "from organize.__version__ import __version__; import organize_gui; print('version', __version__)"
          .venv-pkg/bin/organize --version
          # GUI is an optional extra — install PyQt6 then verify the app entry imports
          uv pip install --python .venv-pkg "PyQt6>=6.5.0,<7.0.0"
          .venv-pkg/bin/python -c "from organize_gui.app import run_app; print('organize_gui app importable')"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 14
